name: Build and Release Anime Player

on:
  push:
    branches:
      - main    # Trigger on pushes to the main branch
      - release # Add other branches here as needed
  pull_request:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [win, linux]
        node-version: [lts/*]

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Setup Node.js and use the latest npm version
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Latest npm
        run: npm install -g npm@latest

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Cache dependencies
      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      # Step 5: Build the application
      - name: Build Application
        run: |
          if [ "${{ matrix.platform }}" == "linux" ]; then
            npm run dist -- --linux;
          elif [ "${{ matrix.platform }}" == "win" ]; then
            npm run dist -- --win;
          fi

      # Step 6: Upload Build Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.platform }}-build
          path: dist/

  release:
    name: Release Artifacts
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Download Artifacts from Build Job
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: ${{ matrix.platform }}-build
          path: dist/

      # Step 3: Create a GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.AppImage dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build, Sign, and Release Anime Player

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  
  release:
    types:
      - published

jobs:
  # Build for Linux
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build for Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --linux

      - name: Generate Checksums (Linux)
        run: |
          cd dist
          sha256sum *.AppImage > SHA256SUMS.txt
          sha512sum *.AppImage >> SHA256SUMS.txt

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/SHA256SUMS.txt

  # Build for Windows
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --win

      - name: Generate Checksums (Windows)
        run: |
          cd dist
          Get-FileHash -Algorithm SHA256 *.exe | Out-File -Encoding UTF8 SHA256SUMS.txt
          Get-FileHash -Algorithm SHA512 *.exe | Out-File -Encoding UTF8 -Append SHA256SUMS.txt

      - name: Sign Windows Executable (Optional)
        if: ${{ secrets.WINDOWS_SIGNING_CERT }}
        uses: UlrichKaiser/signcode@v1
        with:
          certificate: ${{ secrets.WINDOWS_SIGNING_CERT }}
          password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          description: "Anime Player"
          descriptionUrl: "https://github.com/animeredits/Anime-Player"
          file: dist/*.exe

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  # Security Verification
  security-checks:
    name: Security Verification
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-dist/

      - name: VirusTotal Scan (Windows)
        if: ${{ secrets.VIRUSTOTAL_API_KEY }}
        uses: Qytera-GmbH/action-virustotal-scan@v1
        with:
          apiKey: ${{ secrets.VIRUSTOTAL_API_KEY }}
          filePath: windows-dist/*.exe
          waitForResult: true
          comment: "Automated scan for GitHub release"

      - name: Submit to Microsoft SmartScreen
        if: ${{ secrets.MICROSOFT_SUBMISSION_TOKEN && github.event_name == 'release' }}
        run: |
          curl -X POST https://www.microsoft.com/en-us/wdsi/filesubmission \
            -H "Authorization: Bearer ${{ secrets.MICROSOFT_SUBMISSION_TOKEN }}" \
            -F "file=@windows-dist/*.exe" \
            -F "additionalInfo=OpenSourceProject"

  # Release Job
  release:
    name: Publish Release
    needs: [build-linux, build-windows, security-checks]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-dist/

      - name: Generate Release Notes
        id: generate-notes
        run: |
          echo "## Verification" >> notes.md
          echo "Verify checksums before installation:" >> notes.md
          echo '```bash' >> notes.md
          echo "# Linux" >> notes.md
          cat linux-dist/SHA256SUMS.txt >> notes.md
          echo "# Windows" >> notes.md
          cat windows-dist/SHA256SUMS.txt >> notes.md
          echo '```' >> notes.md
          
          if [ -f "security-report.json" ]; then
            echo "## Security Scan Results" >> notes.md
            jq '.data.attributes.last_analysis_stats' security-report.json >> notes.md
          fi

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create ${{ github.ref }} \
            --title "Anime Player ${{ github.ref }}" \
            --notes-file notes.md \
            linux-dist/*.AppImage \
            windows-dist/*.exe \
            linux-dist/SHA256SUMS.txt \
            windows-dist/SHA256SUMS.txt \
            -p

      - name: Update README with Latest Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/Download version: .*/Download version: $VERSION/" README.md
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Update README for version $VERSION"
          git push

  # Auto-tagging job
  tag-release:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Git User
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_EXISTS=$(git ls-remote --tags origin "v$VERSION" | wc -l)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          echo "TAG_EXISTS=$TAG_EXISTS" >> $GITHUB_ENV

      - name: Create and Push Tag
        if: env.TAG_EXISTS == '0'
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

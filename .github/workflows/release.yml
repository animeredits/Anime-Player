name: Build and Release Anime Player

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build for Linux
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build for Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --linux

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage 

  # Build for Windows
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --win

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe 

  # Build for macOS
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    if: false
    # IMPORTANT: Set to false to skip Mac builds until signing is configured
    # Change to: if: true  OR  remove this line entirely to enable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      # OPTIONAL: Code signing - only needed for signed distributions
      # See: MAC_BUILD_SETUP.md for instructions
      # Uncomment when ready with certificates:
      #
      # - name: Import Apple Signing Certificate
      #   uses: apple-actions/import-codesign-certs@v2
      #   with:
      #     p12-file-base64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
      #     p12-password: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
      #
      # - name: Set Signing Identity
      #   run: |
      #     echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
      #     echo "CSC_NAME=${{ secrets.APPLE_SIGNING_CERT_NAME }}" >> $GITHUB_ENV
      #     echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Build for macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # For unsigned builds (development):
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --mac

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

  # Auto-tagging job (only on main branch pushes)
  tag-release:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-linux, build-windows]
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag_created }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin "${{ steps.get_version.outputs.version }}" | wc -l)
          echo "tag_exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Set Git User
        if: steps.check_tag.outputs.tag_exists == '0'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create and Push Tag
        id: create_tag
        if: steps.check_tag.outputs.tag_exists == '0'
        run: |
          git tag -a "${{ steps.get_version.outputs.version }}" -m "Release ${{ steps.get_version.outputs.version }}"
          git push origin "${{ steps.get_version.outputs.version }}"
          echo "tag_created=true" >> $GITHUB_OUTPUT

# Release Job (runs on direct tag push OR after tag-release creates a tag)
  release:
    name: Publish Release
    needs: [build-linux, build-windows, tag-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs.tag-release.outputs.tag_created == 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-dist/
      - name: Extract Tag Version
        id: extract_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog from Conventional Commits
        id: changelog
        run: |
          # Get all commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" $LAST_TAG..HEAD)
          fi
          
          # Parse conventional commits
          CHANGELOG=""
          while IFS= read -r line; do
            case "$line" in
              feat:*|feature:*) CHANGELOG="$CHANGELOG\n[NEW] ${line#*: }" ;;
              fix:*|bug:*)      CHANGELOG="$CHANGELOG\n[FIX] ${line#*: }" ;;
              perf:*|optimize:*)CHANGELOG="$CHANGELOG\n[PERF] ${line#*: }" ;;
              ui:*|style:*)     CHANGELOG="$CHANGELOG\n[UI] ${line#*: }" ;;
              break:*|breaking:*) CHANGELOG="$CHANGELOG\n[BREAK] ${line#*: }" ;;
            esac
          done <<< "$COMMITS"
          
          # Fallback if no conventional commits found
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="\n[NEW] Latest improvements and fixes\n[FIX] General stability updates"
          fi
          
          # Write to file
          echo -e "$CHANGELOG" > changelog.txt
          echo "changelog=$(cat changelog.txt | jq -R -s '.')" >> $GITHUB_OUTPUT

      - name: Upload Release Assets with Changelog
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release create "${{ steps.extract_tag.outputs.version }}" \
            --title "Anime Player ${{ steps.extract_tag.outputs.version }}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --clobber \
            linux-dist/*.AppImage \
            windows-dist/*.exe
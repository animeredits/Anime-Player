name: Release

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Auto-release: push a tag like v1.3.14  →  full build + publish to GitHub Releases
  push:
    tags:
      - 'v*'

  # Manual trigger from GitHub Actions UI (useful for testing or hotfix releases)
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: write   # needed to create GitHub Releases and upload assets

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. Create the GitHub Release FIRST (draft), then parallel builds upload to it
  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id:  ${{ steps.create.outputs.id }}
      upload-url:  ${{ steps.create.outputs.upload_url }}
      tag:         ${{ steps.tag.outputs.tag }}

    steps:
      - name: Derive tag name
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=manual-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        id: create
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name:    ${{ steps.tag.outputs.tag }}
          release_name: Anime Player ${{ steps.tag.outputs.tag }}
          draft:       true    # stays draft until all builds upload their assets
          prerelease:  false
          body: |
            ## Anime Player ${{ steps.tag.outputs.tag }}

            ### 📦 Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `Anime Player Setup *.exe` (installer) · `*-Portable.exe` |
            | macOS    | `Anime Player-*-x64.dmg` (Intel) · `Anime Player-*-arm64.dmg` (Apple Silicon) |
            | Linux    | `Anime Player-*-x86_64.AppImage` · `*.deb` |

            ### 🔄 Auto-updater
            Windows and macOS builds include the built-in auto-updater.
            Linux users should re-download the AppImage for updates.

            ---
            *Built automatically by GitHub Actions.*

  # ────────────────────────────────────────────────────────────────────────────
  # 2a. Windows build
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows (NSIS installer + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you have a code-signing cert, add these secrets:
          # CSC_LINK:          ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD:  ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  # ────────────────────────────────────────────────────────────────────────────
  # 2b. macOS build
  # ────────────────────────────────────────────────────────────────────────────
  build-mac:
    needs: create-release
    runs-on: macos-latest   # Apple Silicon runner (M-series) - builds both x64 + arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS (DMG + ZIP, x64 + arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is fully disabled — no Apple Developer account needed.
          # Users will see a one-time Gatekeeper warning on first launch;
          # they right-click → Open to bypass it. Everything works normally after that.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_KEY_PASSWORD: ''
        run: npm run dist:mac

      - name: Upload macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

  # ────────────────────────────────────────────────────────────────────────────
  # 2c. Linux build
  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron-builder needs these system libs to package AppImage / deb
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libopenjp2-tools \
            rpm \
            libarchive-tools \
            fakeroot \
            dpkg \
            libxss1 \
            libgconf-2-4 \
            libxtst6 \
            libnss3 \
            libgtk-3-0

      - name: Install dependencies
        run: npm ci

      - name: Build Linux (AppImage + deb)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux

      - name: Upload Linux artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Publish — download all artifacts, upload to GitHub Release, un-draft it
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [create-release, build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    # Always run publish even if one platform build failed (partial release)
    if: always() && needs.create-release.result == 'success'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: List downloaded files
        run: find all-dist -type f | sort

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: false   # un-draft the release now that assets are attached
          files: |
            all-dist/**/*.exe
            all-dist/**/*.blockmap
            all-dist/**/*.dmg
            all-dist/**/*.zip
            all-dist/**/*.AppImage
            all-dist/**/*.deb
            all-dist/**/*.rpm
            all-dist/**/latest.yml
            all-dist/**/latest-mac.yml
            all-dist/**/latest-linux.yml
name: Build and Release Anime Player

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  
  # Remove the release trigger since we want auto-publishing from tags
  # release:
  #   types:
  #     - published

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build for Linux
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build for Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --linux

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage

  # Build for Windows
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  # Build for macOS - Disabled but won't block release
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    if: false  # Keep disabled until signing configured
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build for macOS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist -- --mac

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.zip

  # Auto-tagging job (only for main branch pushes)
  tag-release:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only run on main branch pushes
    needs: [build-linux, build-windows]
    outputs:
      tag_created: ${{ steps.tag_marker.outputs.tag_created }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        run: |
          TAG_EXISTS=$(git ls-remote --tags origin "${{ steps.get_version.outputs.version }}" | wc -l)
          echo "tag_exists=$TAG_EXISTS" >> $GITHUB_OUTPUT

      - name: Determine tag creation status
        id: tag_marker
        run: |
          if [[ "${{ steps.check_tag.outputs.tag_exists }}" == '0' ]]; then
            echo "tag_created=true" >> $GITHUB_OUTPUT
          else
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Set Git User
        if: steps.check_tag.outputs.tag_exists == '0'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Create and Push Tag
        if: steps.check_tag.outputs.tag_exists == '0'
        run: |
          git tag -a "${{ steps.get_version.outputs.version }}" -m "Release ${{ steps.get_version.outputs.version }}"
          git push origin "${{ steps.get_version.outputs.version }}"

  # Release Job - ALWAYS publishes when there's a tag (either pushed or auto-created)
  release:
    name: Publish Release
    needs: [build-linux, build-windows]  # Don't wait for tag-release
    runs-on: ubuntu-latest
    # Trigger on tag pushes OR after tag-release creates a tag
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && needs.tag-release.result == 'success' && needs.tag-release.outputs.tag_created == 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changelog

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: linux-dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-dist/

      - name: Extract Tag Version
        id: extract_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref }}"
            TAG="${TAG#refs/tags/}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog from Conventional Commits
        id: changelog
        run: |
          # Get all commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" $LAST_TAG..HEAD)
          fi
          
          # Parse conventional commits
          CHANGELOG=""
          while IFS= read -r line; do
            case "$line" in
              feat:*|feature:*) CHANGELOG="$CHANGELOG\n✅ NEW: ${line#*: }" ;;
              fix:*|bug:*)      CHANGELOG="$CHANGELOG\n🔧 FIX: ${line#*: }" ;;
              perf:*|optimize:*)CHANGELOG="$CHANGELOG\n⚡ PERF: ${line#*: }" ;;
              ui:*|style:*)     CHANGELOG="$CHANGELOG\n🎨 UI: ${line#*: }" ;;
              break:*|breaking:*) CHANGELOG="$CHANGELOG\n⚠️ BREAKING: ${line#*: }" ;;
            esac
          done <<< "$COMMITS"
          
          # Fallback if no conventional commits found
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="\n✅ Latest improvements and fixes\n🔧 General stability updates"
          fi
          
          # Also add build info
          CHANGELOG="$CHANGELOG\n\n---\n**Build Info:**\n- Linux: ✅\n- Windows: ✅\n- macOS: ⏸️ (disabled)"
          
          # Save to file and output
          echo -e "$CHANGELOG" > changelog.txt
          # Use file for notes to avoid escaping issues
          echo "changelog_file=changelog.txt" >> $GITHUB_OUTPUT

      - name: Create and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release already exists
          if gh release view "${{ steps.extract_tag.outputs.version }}" 2>/dev/null; then
            echo "Release already exists, updating assets..."
            # Upload/update assets to existing release
            gh release upload "${{ steps.extract_tag.outputs.version }}" \
              linux-dist/*.AppImage \
              windows-dist/*.exe \
              --clobber
          else
            echo "Creating new release..."
            # Create new release (NOT draft, NOT prerelease)
            gh release create "${{ steps.extract_tag.outputs.version }}" \
              --title "Anime Player ${{ steps.extract_tag.outputs.version }}" \
              --notes-file "${{ steps.changelog.outputs.changelog_file }}" \
              --verify-tag \
              linux-dist/*.AppImage \
              windows-dist/*.exe
          fi
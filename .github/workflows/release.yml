name: Build and Release Anime Player

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  
  release:
    types:
      - published

jobs:
  # Build for Linux
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build for Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --linux

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage

  # Build for Windows
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Build for Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN}} 
        run: npm run dist -- --win

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe 

 # Build for macOS
  build-macos:
    name: Build for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Clean up existing icon
        run: |
         if [ -f "assets/icons/icon.icns" ]; then
          rm "assets/icons/icon.icns"
         fi

      - name: Build for macOS
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} 
        run: npm run dist -- --mac

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
         name: macos-build
         path: dist/*.dmg
         
  # Release Job
  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-build
        path: linux-dist/

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-build
        path: windows-dist/

    - name: Download macOS Artifacts
      uses: actions/download-artifact@v4
      with:
        name: macos-build
        path: macos-dist/

    - name: Generate and Upload latest.yml
      run: |
        npm run generate-latest-yml 
        gh release upload ${{ github.ref }} linux-dist/*.AppImage windows-dist/*.exe macos-dist/*.dmg latest.yml
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}

    - name: Publish Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          linux-dist/*.AppImage
          windows-dist/*.exe
          macos-dist/*.dmg
      env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          if: startsWith(github.ref, 'refs/tags/v')

  # Auto-tagging job
  tag-release:
    name: Auto Tag Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set Git User
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Create Tag
      run: |
        VERSION=$(node -p "require('./package.json').version")
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

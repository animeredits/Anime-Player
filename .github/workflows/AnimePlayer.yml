name: Anime Player App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install

      - name: Build Anime Player App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Player-${{ matrix.os }}
          path: |
            dist/*.exe       # Windows
            dist/*.AppImage  # Linux

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create artifacts directory
        run: |
          mkdir -p ./artifacts

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify Artifacts
        run: |
          ls -R ./artifacts  # Verify if artifacts are downloaded correctly

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the short Git SHA as the version tag
          TAG="v${{ github.sha }}"
          
          # Push the Git tag
          git tag "$TAG"
          git push origin "$TAG"

          # Create a GitHub release with artifacts
          gh release create "$TAG" ./artifacts/** \
            --title "Release $TAG" \
            --notes "Automated release for Linux and Windows"

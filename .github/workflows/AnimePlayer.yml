name: Anime Player App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install

      - name: Set up GitHub CLI
        run: |
          sudo apt-get install gh

      - name: Build Anime Player App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          npm run dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Anime-Player-Setup-${{ github.sha }}.exe
          path: dist/Anime-Player-Setup-*.exe 

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          git tag "v${{ github.sha }}"
          git push origin "v${{ github.sha }}"
          gh release create "v${{ github.sha }}" dist/Anime-Player-Setup-*.exe --title "Release v${{ github.sha }}" --notes "Automated release"

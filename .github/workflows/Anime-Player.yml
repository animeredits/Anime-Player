name: Anime Player App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"

      - name: Install dependencies
        run: |
          npm install

      - name: Build Anime Player App
        run: |
          npm run dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Anime-Player-Setup-${{ github.sha }}.exe
          path: dist/Anime-Player-Setup-${{ github.sha }}.exe

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ github.sha }}"
          git push origin "v${{ github.sha }}"
          gh release create "v${{ github.sha }}" dist/Anime-Player-Setup-${{ github.sha }}.exe --title "Release v${{ github.sha }}" --notes "Automated release"
